# Render Blueprint for Sapiogen AI
# Deploy guide: push this repo to GitHub, then on Render go to
# New + → Blueprint → point at the repo. Render will create the service below.
#
# Set MONGODB_URI, ADMIN_TOKEN, ALLOWED_ORIGINS as "sync: false" secrets in the dashboard.

services:
  - type: web
    name: sapiogen-ai
    runtime: docker
    plan: starter          # upgrade as needed
    region: singapore      # pick the closest region (singapore, oregon, frankfurt, ohio…)
    dockerfilePath: ./Dockerfile
    dockerContext: .
    autoDeploy: true
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 4321
      - key: PUBLIC_SITE_URL
        value: https://sapiogenai.com
      - key: ALLOWED_ORIGINS
        value: https://sapiogenai.com,https://www.sapiogenai.com
      - key: NOTIFY_EMAIL
        value: hello@sapiogenai.com
      # Set these in the Render dashboard — they will NOT be committed:
      - key: MONGODB_URI
        sync: false
      - key: ADMIN_TOKEN
        sync: false
